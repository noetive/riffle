version: 2

project_name: riffle

before:
  hooks:
    - go mod tidy

builds:
  - id: riffle
    main: ./cmd/riffle
    binary: riffle
    env:
      - CGO_ENABLED=0
    # Reproducible builds: the timestamp and paths are the two inputs that
    # otherwise differ between machines, which would make the published
    # provenance impossible for anyone to reproduce independently.
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      # No Windows arm64 package is published, so building one would ship an
      # artifact nothing resolves.
      - goos: windows
        goarch: arm64

archives:
  - id: riffle
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "riffle_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# The npm fallback downloads a bare binary rather than an archive, so each one is
# published under the platform key the wrapper computes from process.platform
# and process.arch. Keep these names in step with the platform table in
# installer/.
#
# The globs stop at the GOARCH and wildcard the rest: goreleaser appends a
# microarchitecture level to the output directory (amd64 as _v1, arm64 as _v8.0)
# and has changed which architectures get one.
release:
  # Without this, any failure after the upload step burns the version number:
  # the assets are already on the release and goreleaser refuses to overwrite
  # them. Safe because the build is reproducible (-trimpath, CGO_ENABLED=0, a
  # commit-derived mod_timestamp, a toolchain pinned by go.mod): a re-run of the
  # same tag replaces the assets with the same bytes.
  replace_existing_artifacts: true

  # A prerelease tag must not become the repository's "Latest release", which is
  # what the installer's fallback download resolves against. `auto` marks it from
  # the tag, matching the npm dist-tag the release workflow derives the same way.
  prerelease: auto

  extra_files:
    - glob: dist/riffle_darwin_arm64*/riffle
      name_template: riffle-darwin-arm64
    - glob: dist/riffle_darwin_amd64*/riffle
      name_template: riffle-darwin-x64
    - glob: dist/riffle_linux_arm64*/riffle
      name_template: riffle-linux-arm64
    - glob: dist/riffle_linux_amd64*/riffle
      name_template: riffle-linux-x64
    - glob: dist/riffle_windows_amd64*/riffle.exe
      name_template: riffle-win32-x64.exe

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: dist/riffle_darwin_arm64*/riffle
      name_template: riffle-darwin-arm64
    - glob: dist/riffle_darwin_amd64*/riffle
      name_template: riffle-darwin-x64
    - glob: dist/riffle_linux_arm64*/riffle
      name_template: riffle-linux-arm64
    - glob: dist/riffle_linux_amd64*/riffle
      name_template: riffle-linux-x64
    - glob: dist/riffle_windows_amd64*/riffle.exe
      name_template: riffle-win32-x64.exe

# Keyless signing: the identity is the GitHub Actions workflow itself, recorded
# in the public transparency log, so a consumer can verify who built an artifact
# without anyone holding a private key that could leak.
#
# One Sigstore bundle carries the signature, certificate and log entry. cosign
# v3 writes nothing else: it ignores --output-signature and --output-certificate
# and fails without --bundle. Verify with `cosign verify-blob --bundle`.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum
    output: true

changelog:
  use: github
  sort: asc

  # The default entry template falls back to `Name <email>` when it cannot
  # resolve a GitHub handle, which would publish an author's address in the
  # release notes. This renders the handle when there is one and nothing
  # otherwise.
  format: "{{ .SHA }}: {{ .Message }}{{ with .AuthorUsername }} (@{{ . }}){{ end }}"
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^build(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^style(\(.+\))?:'
      - '^refactor(\(.+\))?:'
