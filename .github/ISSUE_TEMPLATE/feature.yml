name: Feature
description: Something Riffle should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to get done?
      description: The task your agent is attempting, and where Riffle gets in the way.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: The program you sent and what came back, or why you could not write one.
    validations:
      required: true

  - type: textarea
    id: wanted
    attributes:
      label: What you would like instead
    validations:
      required: false
