name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's only interesting run is the one for its newest commit.
# Pushes to main are never cancelled: the per-commit record of which commit was
# green is what makes a bisect possible.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to a commit, not a tag: a tag can be moved to
# point at different code after review. Dependabot keeps the pins and the
# trailing version comments in step.
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      # goreleaser runs `go mod tidy` before it builds, so an untidy module here
      # means the released binary is built from a dependency set nothing tested.
      - name: Module is tidy
        run: go mod tidy -diff

      # Reachability-filtered: it fires when a path in this code reaches a
      # vulnerable symbol, not when a vulnerable version appears somewhere in
      # the graph. The advisory database is fetched at run time, so a red build
      # here can arrive without a code change, and that is the signal.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --config ./.golangci.yml ./...

  # Drives a real browser. Google Chrome stable is preinstalled on GitHub's
  # Ubuntu runners; the step installs it from Google's apt repository only when
  # it is missing, so the job does not depend on the runner image.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Chrome stable
        run: |
          if ! command -v google-chrome-stable >/dev/null 2>&1; then
            curl -fsSL -o "$RUNNER_TEMP/chrome.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y "$RUNNER_TEMP/chrome.deb"
          fi
          google-chrome-stable --version

      - name: Integration tests
        run: go test -count=1 -tags integration ./internal/...

  # Conditional on the directory so the workflow is valid before the installer
  # lands. A detect step rather than a job-level `if`: hashFiles is not
  # available there.
  installer:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # The installer resolves per-platform binaries and per-user paths, so
      # path handling is only covered by running on each.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: present
        shell: bash
        run: |
          if [ -f installer/package-lock.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No installer/ directory; nothing to test."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.present.outputs.found == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer/package-lock.json

      - if: steps.present.outputs.found == 'true'
        run: npm ci
        working-directory: installer

      - if: steps.present.outputs.found == 'true'
        run: npm test
        working-directory: installer

  # The output directory names are the one contract .goreleaser.yaml and the npm
  # packaging share. Catching a break at tag time means catching it after a
  # GitHub Release exists.
  release-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Same pin as the release job: the cosign it installs is the one whose
      # flags .goreleaser.yaml has to match.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The release job signs keyless with its OIDC identity, which this job does
      # not have. A cosign earlier on PATH passes goreleaser's own sign-blob
      # arguments through to the real one, adding a throwaway key and a signing
      # config with no transparency log, so the configured invocation runs as a
      # release runs it and nothing is published.
      - name: Sign with a throwaway key
        run: |
          dir="$RUNNER_TEMP/cosign"
          mkdir -p "$dir"
          real=$(command -v cosign)
          COSIGN_PASSWORD= cosign generate-key-pair --output-key-prefix "$dir/cosign"
          cosign signing-config create --out "$dir/signing-config.json"
          cat > "$dir/bin-cosign" <<EOF
          #!/bin/sh
          if [ "\$1" = sign-blob ]; then
            export COSIGN_PASSWORD=
            exec "$real" "\$@" --key "$dir/cosign.key" --signing-config "$dir/signing-config.json"
          fi
          exec "$real" "\$@"
          EOF
          mkdir -p "$dir/bin"
          mv "$dir/bin-cosign" "$dir/bin/cosign"
          chmod +x "$dir/bin/cosign"
          echo "$dir/bin" >> "$GITHUB_PATH"
          echo "COSIGN_DIR=$dir" >> "$GITHUB_ENV"

      # --snapshot skips publishing; everything before it is what breaks silently.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --snapshot --clean

      - name: Signature verifies
        run: >-
          cosign verify-blob --key "$COSIGN_DIR/cosign.pub" --insecure-ignore-tlog=true
          --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Snapshot builds the five platform binaries
        run: |
          for p in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            ls dist/riffle_${p}*/riffle >/dev/null
          done
          ls dist/riffle_windows_amd64*/riffle.exe >/dev/null
